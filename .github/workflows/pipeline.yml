name: Pruebas de aceptación

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-aceptacion:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            pruebas/package-lock.json

      - name: Instalar dependencias de la app
        working-directory: app
        run: npm ci

      - name: Instalar dependencias de las pruebas
        working-directory: pruebas
        run: npm ci

      - name: Instalar Chromium
        working-directory: pruebas
        run: npx playwright install --with-deps chromium

      # Sin continue-on-error: si una prueba de aceptación falla, el job queda en rojo.
      # webServer (playwright.config.js) enciende la app antes de las pruebas.
      - name: Ejecutar pruebas @acceptanceTest
        working-directory: pruebas
        run: npx playwright test --grep @acceptanceTest

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pruebas/playwright-report
          retention-days: 30
