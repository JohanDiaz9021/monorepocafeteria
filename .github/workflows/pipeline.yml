name: Pruebas de aceptación

on:
  push:
    branches: [ 'main', 'develop' ]
  pull_request:
    branches: [ 'main', 'develop' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-aceptacion:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            pruebas/package-lock.json

      - name: Instalar dependencias de la app
        working-directory: app
        run: npm ci

      - name: Instalar dependencias de las pruebas
        working-directory: pruebas
        run: npm ci

      - name: Instalar Chromium
        working-directory: pruebas
        run: npx playwright install --with-deps chromium

      # El & deja la app corriendo en segundo plano para los pasos siguientes.
      - name: Levantar la app en el puerto 3000
        working-directory: app
        run: npm start &

      # Pregunta a la app cada segundo, hasta 30 veces. Si no responde, el job falla aquí.
      - name: Esperar a que la app responda
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "La app no respondió en http://localhost:3000"
          exit 1

      # Sin continue-on-error: si una prueba de aceptación falla, el job queda en rojo.
      # webServer reutiliza la app que ya levantó el paso anterior (reuseExistingServer: true).
      - name: Ejecutar pruebas @acceptanceTest
        working-directory: pruebas
        run: npx playwright test --grep @acceptanceTest

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pruebas/playwright-report
          retention-days: 30
